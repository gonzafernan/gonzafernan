name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - "Makefile"
      - ".github/workflows/cv.yml"
  pull_request:
    paths:
      - "cv/**"
      - "Makefile"
      - ".github/workflows/cv.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.12.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Build PDFs
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: "*.pdf"

      # Keep the latest PDFs on a fixed "cv" release so download links never change:
      # https://github.com/<owner>/<repo>/releases/download/cv/cv-fernandez_gonzalo-en.pdf
      - name: Publish to "cv" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cv >/dev/null 2>&1 || \
            gh release create cv --title "CV" --notes "Latest CV, built automatically from cv/ by CI." --latest
          gh release upload cv *.pdf --clobber
